name: release

# Build the prebuilt `forge` CLI binaries and attach them to a GitHub
# Release. Triggered only by a version tag push (e.g. `v3.0.2`); never on
# ordinary pushes or pull requests.
#
# Asset layout (one archive per target, version carried by the release tag):
#   forge-x86_64-unknown-linux-gnu.tar.gz
#   forge-aarch64-unknown-linux-gnu.tar.gz
#   forge-x86_64-apple-darwin.tar.gz
#   forge-aarch64-apple-darwin.tar.gz
#   forge-x86_64-pc-windows-msvc.zip
#   SHA256SUMS
#
# Each archive contains a single `forge` binary (`forge.exe` on Windows).
# The install script (`install.sh` at the repo root) downloads the archive
# for the host platform from the latest release and verifies it against
# SHA256SUMS.
#
# The CLI is distributed only through these release binaries.
#
# Toolchain matches rust.yml: Rust 1.85, the crates' MSRV (edition 2024).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: forge-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: forge-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: forge-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: forge-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: forge-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85 (MSRV) + target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}

      - name: Install aarch64 Linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build the forge CLI (release)
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: crates/forge
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Smoke-check the built binary
        # The aarch64 Linux binary is cross-built on x86_64 and cannot run
        # on the build host; the archive step still verifies it was produced.
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          BIN="crates/forge/target/${{ matrix.target }}/release/forge"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            BIN="$BIN.exe"
          fi
          "$BIN" --help | grep -q "Forge Anything CLI"
          echo "built binary runs: $BIN"

      - name: Package the binary (tar.gz)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          BIN="crates/forge/target/${{ matrix.target }}/release/forge"
          STAGE="$(mktemp -d)"
          cp "$BIN" "$STAGE/forge"
          tar -czf "${{ matrix.archive }}" -C "$STAGE" forge

      - name: Package the binary (zip)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'forge-stage')
          Copy-Item 'crates/forge/target/x86_64-pc-windows-msvc/release/forge.exe' (Join-Path $stage 'forge.exe')
          Compress-Archive -Path (Join-Path $stage 'forge.exe') -DestinationPath '${{ matrix.archive }}'

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create SHA256SUMS and the GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum forge-*.tar.gz forge-*.zip > SHA256SUMS
          cat SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            --title "Forge Anything ${GITHUB_REF_NAME}" \
            --generate-notes \
            forge-*.tar.gz forge-*.zip SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
