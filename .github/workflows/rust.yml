name: rust

# Rust crates (crates/forge-scaffold, crates/forge): format, lint, build,
# test, and the end-to-end checks. Both crates have no external
# dependencies (forge-scaffold is std-only; forge depends on it by path),
# so the build needs no registry cache and stays offline-friendly.
#
# Toolchain is pinned to 1.85, the crates' MSRV (edition 2024). If the code
# uses a newer feature, this job fails first.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [forge-scaffold, forge]
    defaults:
      run:
        working-directory: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test (unit + e2e acceptance)
        run: cargo test --locked

  scaffold-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"

      - name: Build the scaffold binary (release)
        run: cargo build --release --locked
        working-directory: crates/forge-scaffold

      - name: Scaffold into an empty folder
        run: |
          ./crates/forge-scaffold/target/release/forge-scaffold \
            --source "$GITHUB_WORKSPACE" --name ci-proof /tmp/forge-scaffold-proof

      - name: Verify the scaffolded repo
        run: |
          set -euo pipefail
          OUT=/tmp/forge-scaffold-proof
          test "$(ls "$OUT/skills" | wc -l)" -eq 38
          test "$(ls "$OUT/agents" | wc -l)" -eq 18
          test "$(ls "$OUT/commands" | wc -l)" -eq 25
          test -f "$OUT/README.md"
          test -f "$OUT/AGENTS.md"
          test -f "$OUT/WORKFLOW.md"
          test -f "$OUT/skills.json"
          test -f "$OUT/skills/forge/SKILL.md"
          test -f "$OUT/agents/forge-ceo.md"
          test -f "$OUT/.claude-plugin/marketplace.json"
          test -f "$OUT/gemini-extension.json"
          test -f "$OUT/.cursor/rules/forge.mdc"
          test -f "$OUT/docs/departments/Executive/README.md"
          test -f "$OUT/docs/departments/Knowledge/README.md"
          # No old product name anywhere in the scaffolded repo.
          if grep -rio "galyarder framework\|galyarder-framework" "$OUT" | head -1 | grep -q .; then
            echo "scaffolded repo still names the old product" >&2
            exit 1
          fi
          echo "scaffold e2e: OK ($(find "$OUT" -type f | wc -l) files)"

  forge-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"

      - name: Build the forge CLI (release)
        run: cargo build --release --locked
        working-directory: crates/forge

      - name: Help and version match the JS CLI byte-for-byte
        run: |
          set -euo pipefail
          FORGE=./crates/forge/target/release/forge
          "$FORGE" --help > /tmp/forge-rs-help.txt
          node bin/forge.js --help > /tmp/forge-js-help.txt
          diff /tmp/forge-rs-help.txt /tmp/forge-js-help.txt
          "$FORGE" --version > /tmp/forge-rs-ver.txt
          node bin/forge.js --version > /tmp/forge-js-ver.txt
          diff /tmp/forge-rs-ver.txt /tmp/forge-js-ver.txt
          echo "forge help/version parity: OK"

      - name: Scaffold through the forge CLI
        run: |
          set -euo pipefail
          ./crates/forge/target/release/forge scaffold --name ci-proof /tmp/forge-cli-proof
          test "$(ls /tmp/forge-cli-proof/skills | wc -l)" -eq 38
          test "$(ls /tmp/forge-cli-proof/agents | wc -l)" -eq 18
          test "$(ls /tmp/forge-cli-proof/commands | wc -l)" -eq 25
          test -f /tmp/forge-cli-proof/README.md
          echo "forge scaffold: OK"

      - name: Smoke through the forge CLI
        run: |
          ./crates/forge/target/release/forge smoke | tee /tmp/forge-smoke.txt
          grep -q "SMOKE TEST PASSED" /tmp/forge-smoke.txt
