name: smoke-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run audit-grade smoke test
        run: bash scripts/smoke.sh

      - name: Check plugin manifest versions
        run: python3 scripts/sync-plugin-version.py --check

      - name: Check skills manifest is in sync
        run: python3 scripts/sync-skills-manifest.py --check