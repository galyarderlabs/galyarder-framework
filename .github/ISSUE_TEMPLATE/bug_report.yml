name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go privately to the maintainer instead; see [SECURITY.md](https://github.com/galyarderlabs/galyarder-framework/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the framework with …
        2. Run …
    validations:
      required: true
  - type: input
    id: framework-version
    attributes:
      label: Framework version
      description: The output of `npm view galyarder-framework version`, or the git commit.
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Claude Code
        - OpenAI Codex CLI
        - Gemini CLI
        - Cursor
        - Windsurf
        - OpenCode
        - Hermes Agent
        - OpenClaw
        - Kilo Code
        - Augment
        - Antigravity
        - Galyarder Agent
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - npm install -g
        - npx skills add
        - git clone
        - Other
    validations:
      required: true
  - type: textarea
    id: smoke
    attributes:
      label: Output of `galyarder smoke`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The command output. Check it for anything private before posting.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
